get_track:
  name: Obtenir un titre
  description: Lit les métadonnées d'un titre Amazon Music (lecture seule).
  fields:
    track_id:
      name: Identifiant du titre
      description: Identifiant Amazon Music, par exemple B0GWPYXQHB.
      required: true
      example: "B0GWPYXQHB"
      selector:
        text:

list_playlists:
  name: Lister les playlists
  description: Liste les playlists créées par le compte (lecture seule, première page).
  fields:
    limit:
      name: Nombre maximum
      description: Nombre de playlists à retourner.
      default: 50
      selector:
        number:
          min: 1
          max: 200
